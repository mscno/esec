name: Release

on:
    push:
        tags: [ 'v*.*.*' ]

permissions:
    contents: write
    packages: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Get latest Go version
              id: gover
              run: echo "goversion=$(awk -F':|-' '!/^#/ {print $2}' .github/dockerfile-for-dependabot/Dockerfile)" >> "$GITHUB_OUTPUT"
            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                  go-version: "${{ steps.gover.outputs.goversion }}"
            - name: Install Cosign
              uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
            - name: Install Syft
              uses: anchore/sbom-action/download-syft@v0
            - name: Extract release changelog
              run: |
                  version=${GITHUB_REF#refs/tags/}
                  mkdir -p tmp
                  awk -v version="$version" '
                    $0 == "# " version { found=1; next }
                    found && /^# / { exit }
                    found { print }
                  ' CHANGELOG.md > tmp/release_changelog.md
            - name: Release
              uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
              with:
                  distribution: goreleaser
                  version: "~> v2"
                  args: release --clean --release-notes=tmp/release_changelog.md
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: "Sign .tar.gz"
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: "dist/*.tar.gz"
            - name: "Sign .deb"
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: "dist/*.deb"
            - name: "Attest checksums"
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: "dist/checksums.txt"
            - name: "Attest SBOMs"
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: "dist/*.sbom.json"
            - name: "Attest source archive"
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: "dist/*_source.tar.gz"
