[tools]
go = "1.27"
golangci-lint = "latest"
lefthook = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"

[tasks.fmt]
description = "Format Go files"
run = ["goimports -w .", "go fmt ./..."]

[tasks.lint]
description = "Run linter"
run = "golangci-lint run ./..."

[tasks.hooks]
description = "Install git hooks"
run = "lefthook install"

[tasks.test]
description = "Run tests"
env = { TEST_DATASTORE_PROJECT = "esec-prod" }
run = "go test ./..."

[tasks.cover]
description = "Run tests and open coverage report"
run = ["go test -coverprofile=coverage.out ./...", "go tool cover -html=coverage.out"]

[tasks.build]
description = "Build esec binary as dev+commit and print version"
run = """
commit=$(git rev-parse --short HEAD 2>/dev/null || echo none)
go build -ldflags "-s -w -X main.version=dev -X main.commit=$commit -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o esec ./cmd/esec
./esec --version
"""
